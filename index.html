<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peppy</title>
  <meta name="description" content="Home workouts with a buddy who cheers you on.">
  <meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Peppy">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/figures.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <main class="views">
      <section class="view" id="view-onboarding" aria-label="Welcome"></section>
      <section class="view" id="view-today" aria-label="Today"></section>
      <section class="view" id="view-workout" aria-label="Workout"></section>
      <section class="view" id="view-progress" aria-label="Progress"></section>
      <section class="view" id="view-buddy" aria-label="Buddy"></section>
      <section class="view" id="view-settings" aria-label="Settings"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Menu" hidden>
      <button type="button" data-view="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1Z"/></svg>
        <span>Today</span>
      </button>
      <button type="button" data-view="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M10 20V8M15 20v-5M20 20V5"/></svg>
        <span>Progress</span>
      </button>
      <button type="button" data-view="buddy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="5.5"/><path d="M8 5 6.5 2.5M16 5l1.5-2.5M6 20.5c1-3 3.3-4.5 6-4.5s5 1.5 6 4.5"/></svg>
        <span>Buddy</span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div class="player" id="player" hidden></div>
  <dialog class="sheet" id="sheet"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
